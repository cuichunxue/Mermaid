<!DOCTYPE html>

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid図エディタ</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5;
        min-height: 100vh;
        color: #333;
    }
    
    .header {
        background: #fff;
        border-bottom: 1px solid #ddd;
        padding: 12px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .header h1 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #222;
    }
    
    .header-right {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 0.8rem;
        color: #888;
    }
    
    .auto-save {
        opacity: 0;
        transition: opacity 0.2s;
    }
    .auto-save.show { opacity: 1; }
    
    .shortcut {
        font-family: monospace;
        background: #f0f0f0;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.75rem;
    }
    
    .main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: calc(100vh - 49px);
    }
    
    .editor-section {
        display: flex;
        flex-direction: column;
        border-right: 1px solid #ddd;
        background: #fff;
    }
    
    .preview-section {
        display: flex;
        flex-direction: column;
        background: #fafafa;
    }
    
    .toolbar {
        padding: 10px 16px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fff;
        flex-wrap: wrap;
        gap: 8px;
    }
    
    .toolbar-label {
        font-size: 0.85rem;
        font-weight: 500;
        color: #555;
    }
    
    .toolbar-actions {
        display: flex;
        gap: 6px;
    }
    
    .btn {
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        font-size: 0.8rem;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        color: #333;
    }
    
    .btn:hover {
        background: #f5f5f5;
        border-color: #999;
    }
    
    .btn:active {
        background: #eee;
    }
    
    .btn-primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
    }
    
    .btn-primary:hover {
        background: #1d4ed8;
        border-color: #1d4ed8;
    }
    
    .templates {
        padding: 10px 16px;
        border-bottom: 1px solid #eee;
        background: #fafafa;
    }
    
    .templates-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }
    
    .template-btn {
        padding: 4px 10px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.75rem;
        color: #555;
        transition: border-color 0.15s, color 0.15s;
    }
    
    .template-btn:hover {
        border-color: #2563eb;
        color: #2563eb;
    }
    
    textarea {
        flex: 1;
        padding: 16px;
        border: none;
        font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
        font-size: 14px;
        line-height: 1.5;
        resize: none;
        outline: none;
        background: #fff;
        color: #333;
    }
    
    textarea::placeholder {
        color: #aaa;
    }
    
    .preview-toolbar {
        background: #fafafa;
    }
    
    .zoom-group {
        display: flex;
        align-items: center;
        gap: 2px;
    }
    
    .zoom-btn {
        width: 28px;
        height: 28px;
        border: 1px solid #ccc;
        background: #fff;
        cursor: pointer;
        font-size: 1rem;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #555;
    }
    
    .zoom-btn:hover {
        background: #f5f5f5;
        border-color: #999;
    }
    
    .zoom-level {
        font-size: 0.75rem;
        color: #888;
        min-width: 40px;
        text-align: center;
    }
    
    .message {
        padding: 8px 16px;
        font-size: 0.8rem;
        display: none;
    }
    
    .message.error {
        background: #fef2f2;
        color: #b91c1c;
        border-bottom: 1px solid #fecaca;
    }
    
    .message.success {
        background: #f0fdf4;
        color: #15803d;
        border-bottom: 1px solid #bbf7d0;
    }
    
    .message.show { display: block; }
    
    .preview-area {
        flex: 1;
        padding: 20px;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    #mermaidOutput {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 6px;
        padding: 24px;
        min-width: 200px;
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    #mermaidOutput svg {
        max-width: 100%;
        height: auto;
    }
    
    .empty {
        color: #999;
        font-size: 0.9rem;
    }
    
    .loading {
        display: none;
        color: #888;
        font-size: 0.85rem;
    }
    
    .loading.show { display: block; }
    
    @media (max-width: 900px) {
        .main {
            grid-template-columns: 1fr;
            height: auto;
        }
        .editor-section {
            border-right: none;
            border-bottom: 1px solid #ddd;
            min-height: 40vh;
        }
        .preview-section {
            min-height: 40vh;
        }
        .header-right {
            display: none;
        }
    }
</style>

</head>
<body>
    <header class="header">
        <h1>Mermaid図エディタ</h1>
        <div class="header-right">
            <span class="auto-save" id="autoSave">保存済み</span>
            <span class="shortcut">Ctrl+Enter で実行</span>
        </div>
    </header>

<main class="main">
    <section class="editor-section">
        <div class="toolbar">
            <span class="toolbar-label">コード</span>
            <div class="toolbar-actions">
                <button class="btn btn-primary" id="renderBtn">実行</button>
                <button class="btn" id="clearBtn">クリア</button>
            </div>
        </div>
        <div class="templates">
            <div class="templates-row" id="templates"></div>
        </div>
        <textarea id="code" placeholder="Mermaidコードを入力..."></textarea>
    </section>
    
    <section class="preview-section">
        <div class="toolbar preview-toolbar">
            <span class="toolbar-label">プレビュー</span>
            <div class="toolbar-actions">
                <div class="zoom-group">
                    <button class="zoom-btn" id="zoomOut">−</button>
                    <span class="zoom-level" id="zoomLevel">100%</span>
                    <button class="zoom-btn" id="zoomIn">+</button>
                    <button class="zoom-btn" id="zoomReset">↺</button>
                </div>
                <button class="btn" id="svgBtn">SVG保存</button>
                <button class="btn" id="pngBtn">PNG保存</button>
            </div>
        </div>
        <div class="message error" id="error"></div>
        <div class="message success" id="success"></div>
        <div class="preview-area">
            <div class="loading" id="loading">読み込み中...</div>
            <div id="mermaidOutput"></div>
        </div>
    </section>
</main>

<script>
(() => {
    'use strict';

    const TEMPLATES = {
        flowchart: ['フローチャート', `graph TD
A[開始] --> B{条件分岐}
B -->|Yes| C[処理A]
B -->|No| D[処理B]
C --> E[終了]
D --> E`],
        sequence: ['シーケンス図', `sequenceDiagram
participant U as ユーザー
participant S as システム
participant D as DB
U->>S: リクエスト
S->>D: クエリ
D-->>S: 結果
S-->>U: レスポンス`],
        class: ['クラス図', `classDiagram
class Animal {
    +String name
    +eat()
}
class Dog {
    +bark()
}
Animal <|-- Dog`],
        state: ['状態遷移図', `stateDiagram-v2
[*] --> 待機
待機 --> 処理中: 開始
処理中 --> 完了: 成功
処理中 --> エラー: 失敗
完了 --> [*]`],
        er: ['ER図', `erDiagram
CUSTOMER ||--o{ ORDER : places
ORDER ||--|{ ITEM : contains
CUSTOMER {
    string name
    string email
}`],
        gantt: ['ガント', `gantt
title スケジュール
dateFormat YYYY-MM-DD
section 開発
    設計 :a1, 2024-01-01, 14d
    実装 :a2, after a1, 21d`],
        pie: ['円グラフ', `pie title 比率
"A" : 40
"B" : 35
"C" : 25`],
        git: ['Git', `gitGraph
commit
branch dev
commit
checkout main
merge dev`]
    };

    const $ = id => document.getElementById(id);
    const code = $('code');
    const output = $('mermaidOutput');
    const error = $('error');
    const success = $('success');
    const loading = $('loading');
    const zoomLevel = $('zoomLevel');
    const autoSave = $('autoSave');

    let zoom = 1;
    let rendering = false;
    let saveTimer;

    mermaid.initialize({
        startOnLoad: false,
        theme: 'neutral',
        securityLevel: 'loose',
        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif',
        fontSize: 18,
        flowchart: {
            htmlLabels: false,
            curve: 'basis',
            padding: 20
        }
    });

    // テンプレートボタン生成
    const tpl = $('templates');
    Object.entries(TEMPLATES).forEach(([k, [label]]) => {
        const btn = document.createElement('button');
        btn.className = 'template-btn';
        btn.textContent = label;
        btn.onclick = () => { code.value = TEMPLATES[k][1]; save(); render(); };
        tpl.appendChild(btn);
    });

    const msg = (type, text) => {
        const el = type === 'error' ? error : success;
        (type === 'error' ? success : error).classList.remove('show');
        el.textContent = text;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), type === 'error' ? 4000 : 2000);
    };

    const save = () => {
        localStorage.setItem('mermaid_code', code.value);
        autoSave.classList.add('show');
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => autoSave.classList.remove('show'), 1500);
    };

    const render = async () => {
        if (rendering) return;
        let src = code.value.trim();
        error.classList.remove('show');
        success.classList.remove('show');

        if (!src) {
            output.innerHTML = '<span class="empty">コードを入力してください</span>';
            return;
        }

        // <br/>タグを改行に自動変換（SVGエラー防止）
        const hasBrTags = /<br\s*\/?>/gi.test(src);
        if (hasBrTags) {
            src = src.replace(/<br\s*\/?>/gi, '\n');
            msg('success', '<br/>タグを改行に自動変換しました');
            // コードエディタも更新
            setTimeout(() => {
                code.value = src;
                save();
            }, 100);
        }

        rendering = true;
        loading.classList.add('show');
        output.innerHTML = '';

        try {
            const { svg } = await mermaid.render('m' + Date.now(), src);
            output.innerHTML = svg;
            applyZoom();
            if (!hasBrTags) msg('success', '完了');
        } catch (e) {
            msg('error', e.message || 'エラー');
            output.innerHTML = '<span class="empty">表示できません</span>';
        } finally {
            loading.classList.remove('show');
            rendering = false;
        }
    };

    const applyZoom = () => {
        zoomLevel.textContent = Math.round(zoom * 100) + '%';
        const svg = output.querySelector('svg');
        if (svg) svg.style.transform = `scale(${zoom})`;
    };

    // モバイル判定
    const isMobile = () => {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
               (navigator.maxTouchPoints && navigator.maxTouchPoints > 2);
    };

    // スマホ対応のダウンロード関数
    const download = async (blob, name) => {
        // Web Share API対応（スマホで共有機能を使用）
        if (isMobile() && navigator.share && navigator.canShare) {
            try {
                const file = new File([blob], name, { type: blob.type });
                if (navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'Mermaid図',
                        text: name
                    });
                    msg('success', 'ファイルを共有しました');
                    return;
                }
            } catch (e) {
                // 共有がキャンセルされた場合は通常のダウンロードにフォールバック
                if (e.name !== 'AbortError') {
                    console.log('共有失敗、ダウンロードにフォールバック:', e);
                }
            }
        }

        // 通常のダウンロード（デスクトップ + モバイル対応）
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.style.display = 'none';

        // iOS Safari対応：documentに追加してからクリック
        document.body.appendChild(a);
        a.click();

        // クリーンアップを遅延実行（モバイル対応）
        setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 100);
    };

    $('renderBtn').onclick = render;
    $('clearBtn').onclick = () => {
        if (confirm('クリアしますか？')) {
            code.value = '';
            output.innerHTML = '<span class="empty">コードを入力してください</span>';
            localStorage.removeItem('mermaid_code');
        }
    };

    $('zoomIn').onclick = () => { zoom = Math.min(3, zoom + 0.1); applyZoom(); };
    $('zoomOut').onclick = () => { zoom = Math.max(0.2, zoom - 0.1); applyZoom(); };
    $('zoomReset').onclick = () => { zoom = 1; applyZoom(); };

    $('svgBtn').onclick = async () => {
        const svg = output.querySelector('svg');
        if (!svg) return msg('error', '図がありません');
        const clone = svg.cloneNode(true);
        clone.removeAttribute('style');

        // HTMLタグを完全にクリーンアップ（SVGエラー防止）
        const foreignObjects = clone.querySelectorAll('foreignObject');
        foreignObjects.forEach(fo => {
            const text = fo.textContent || '';
            const textElement = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            textElement.textContent = text;
            fo.parentNode?.replaceChild(textElement, fo);
        });

        // <br>タグなどのHTMLタグを削除
        let svgText = clone.outerHTML;
        svgText = svgText.replace(/<br\s*\/?>/gi, '\n');
        svgText = svgText.replace(/<\/?span[^>]*>/gi, '');
        svgText = svgText.replace(/<\/?div[^>]*>/gi, '');

        await download(new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' }), `diagram-${Date.now()}.svg`);
        if (!isMobile() || !navigator.share) {
            msg('success', 'SVG保存完了（クリーン版）');
        }
    };

    $('pngBtn').onclick = async () => {
        const svg = output.querySelector('svg');
        if (!svg) return msg('error', '図がありません');
        const clone = svg.cloneNode(true);
        clone.removeAttribute('style');

        // SVGデータをクリーンアップ
        let data = new XMLSerializer().serializeToString(clone);
        data = data.replace(/<br\s*\/?>/gi, '');

        const rect = svg.getBoundingClientRect();
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: false });

        // 超高解像度（16倍）で鮮明なPNGを生成
        const scale = 16;
        canvas.width = rect.width * scale;
        canvas.height = rect.height * scale;

        const img = new Image();
        img.onload = async () => {
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (b) => {
                if (b) {
                    await download(b, `diagram-${Date.now()}.png`);
                    if (!isMobile() || !navigator.share) {
                        msg('success', 'PNG保存完了（16倍超高解像度）');
                    }
                } else {
                    msg('error', 'PNG生成に失敗しました');
                }
            }, 'image/png', 1.0);
        };
        img.onerror = () => msg('error', 'PNG生成に失敗しました');
        img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(data)));
    };

    code.onkeydown = e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); render(); }
        if (e.key === 'Tab') {
            e.preventDefault();
            const s = code.selectionStart;
            code.value = code.value.slice(0, s) + '    ' + code.value.slice(code.selectionEnd);
            code.selectionStart = code.selectionEnd = s + 4;
        }
    };

    let debounce;
    code.oninput = () => {
        save();
        clearTimeout(debounce);
        debounce = setTimeout(render, 600);
    };

    // 初期化
    const saved = localStorage.getItem('mermaid_code');
    code.value = saved || TEMPLATES.flowchart[1];
    render();
})();
</script>

</body>
</html>
